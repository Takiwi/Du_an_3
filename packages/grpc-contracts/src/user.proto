syntax = 'proto3';

package user;

service UserService {
    rpc createUserProfile (CreateProfileInput) returns (CreateProfileOutput);
}

message CreateProfileInput {
    string username = 1;
    string email = 2;
}

message CreateProfileOutput {
    string id = 1;
    string username = 2;
    string email = 3;
    string status = 4;
}
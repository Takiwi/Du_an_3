services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_auth
    env_file:
      - ./.env.db
    ports:
      - '5432:5432'
    command: ['postgres', '-c', 'log_statement=all']
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d auth_db']
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  redis:
    image: redis:7-alpine
    container_name: redis_auth
    command: redis-server --appendonly yes # Bật chế độ AOF để lưu dữ liệu lâu dài (nếu cần)
    ports:
      - '6379:6379' # Bỏ hoặc đổi thành "6380:6379" nếu bị trùng port ở máy host
    volumes:
      - auth_redis_data:/data # Volume riêng cho Redis
    deploy:
      resources:
        limits:
          memory: 128M # Giới hạn RAM cho Redis (tùy nhu cầu)
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping'] # Kiểm tra trạng thái sống của Redis
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
volumes:
  auth_postgres_data:
  auth_redis_data:

# pnpm-workspace.yaml (chỉ ở root)
packages:
  - "frontend"
  - "backend/*"
  - "packages/*"
allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": true
  base64: true
  bcrypt: true
  compress-buffer: true
  esbuild: true
  hiredis: true
  iconv: true
  pg: true
  prisma: true
  stacktrace: true
  unrs-resolver: true
  uriparser: true
